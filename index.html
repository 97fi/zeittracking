<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;padding:1rem;padding-top:max(1rem,env(safe-area-inset-top))}
.app{max-width:420px;width:100%;background:#fff;border:1px solid #e0e0e0;border-radius:16px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee}
.topbar-title{font-size:15px;font-weight:500}
.top-btn{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #ddd;background:none;cursor:pointer;color:#555}
#sync-status{font-size:11px;color:#888;cursor:pointer;white-space:nowrap}
#sync-status.err{color:#c62828}
#sync-status.ok{color:#2e7d32}
.nav{display:flex;border-bottom:1px solid #eee}
.nav-btn{flex:1;padding:10px 4px;font-size:12px;font-weight:500;background:none;border:none;cursor:pointer;color:#888;border-bottom:2px solid transparent}
.nav-btn.active{color:#111;border-bottom:2px solid #111}
.view{display:none;padding:12px 14px}
.view.active{display:block}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.date-nav button{background:none;border:1px solid #ddd;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
.date-label{font-size:14px;font-weight:500}
.slots{display:flex;flex-direction:column;gap:2px}
.slot{display:flex;align-items:stretch;gap:8px;min-height:30px}
.slot-time{font-size:10px;color:#999;width:84px;flex-shrink:0;display:flex;align-items:center}
.slot-block{flex:1;border-radius:5px;padding:4px 8px;cursor:pointer;min-height:26px;display:flex;align-items:center;justify-content:space-between;border:1px solid transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;overflow:hidden}
.slot-block:hover{opacity:0.82}
.slot-block.empty{background:#f5f5f5;border:1px dashed #ccc}
.slot-block.selecting-start{outline:2px solid #378ADD;outline-offset:1px}
.slot-block.in-range{background:#dbeeff !important;border-color:#378ADD !important;opacity:1 !important}
.slot-block.range-end{outline:2px solid #378ADD;outline-offset:1px}
.slot-label{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot-note{font-size:11px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%;opacity:0.85}
.sleep-collapsed{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;margin-bottom:2px}
.sleep-collapsed-bar{flex:1;height:8px;border-radius:4px;opacity:0.6}
.sleep-collapsed-label{font-size:11px;color:#888;white-space:nowrap}
.sleep-collapsed-arrow{font-size:11px;color:#aaa}
.picker-panel{background:#f8f8f8;border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid #e8e8e8}
.picker-title{font-size:11px;color:#666;margin-bottom:7px;font-weight:500}
.picker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.cat-pill{padding:5px 4px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;text-align:center;border:none;line-height:1.3}
.cat-pill.clear{background:#fff;color:#666;border:1px solid #ddd}
.note-row{display:flex;gap:6px;margin-top:6px}
.note-input{flex:1;font-size:16px;padding:5px 8px;border-radius:8px;border:1px solid #ddd;background:#fff}
.note-save-btn{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #ddd;background:none;cursor:pointer}
.day-summary{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.summary-pill{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.week-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px;margin:6px 0 12px}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stat-name{font-size:13px;flex:1}
.stat-val{font-size:13px;color:#666}
.settings-section-title{font-size:11px;font-weight:500;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em}
.cat-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cat-name-input{flex:1;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid #ddd}
.del-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:18px;padding:0 2px;line-height:1}
.add-btn{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #ddd;background:none;cursor:pointer;width:100%}
.save-btn{font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid #ddd;background:none;cursor:pointer;width:100%;margin-top:8px;font-weight:500}
.box{background:#f8f8f8;border-radius:10px;padding:10px;margin-bottom:12px;border:1px solid #e8e8e8}
.field{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.field label{font-size:12px;color:#888;min-width:70px}
.field input{flex:1;min-width:0;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid #ddd;background:#fff}
.hint{font-size:11px;color:#999;margin-top:6px;line-height:1.4}
.cal-wrap{background:#f8f8f8;border:1px solid #e0e0e0;border-radius:10px;padding:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-header button{background:none;border:1px solid #ddd;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
.cal-month-label{font-size:13px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:10px;color:#aaa;text-align:center;padding:2px 0}
.cal-day{font-size:12px;text-align:center;padding:5px 2px;border-radius:5px;cursor:pointer;color:#333}
.cal-day:hover{background:#eee}
.cal-day.today{font-weight:600;color:#111}
.cal-day.selected{background:#111;color:#fff;border-radius:5px}
.cal-day.has-data{position:relative}
.cal-day.has-data::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#888}
.cal-day.selected.has-data::after{background:#fff}
.cal-day.empty{cursor:default;color:#ccc}
</style>

<body>
<div class="app">
  <div class="topbar">
    <span class="topbar-title">Zeittracking</span>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="top-btn" onclick="exportData()">Export</button>
      <label class="top-btn">Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
      <span id="sync-status" onclick="sync(true)" title="Jetzt synchronisieren">lokal</span>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn active" data-view="day">Tag</button>
    <button class="nav-btn" data-view="week">Woche</button>
    <button class="nav-btn" data-view="settings">Einstellungen</button>
  </div>

  <div class="view active" id="view-day">
    <div class="date-nav">
      <button onclick="changeDay(-1)">&#8592;</button>
      <span class="date-label" id="day-label" onclick="toggleCalendar()" style="cursor:pointer;border-bottom:1px dashed #ccc;padding-bottom:1px" title="Kalender öffnen"></span>
      <button onclick="changeDay(1)">&#8594;</button>
    </div>
    <div id="cal-container" style="display:none;margin-bottom:10px"></div>
    <div class="day-summary" id="day-summary"></div>
    <div style="font-size:11px;color:#aaa;margin-bottom:8px;text-align:right" id="mode-hint"></div>
    <div class="slots" id="slots-container"></div>
  </div>

  <div class="view" id="view-week">
    <div class="date-nav">
      <button onclick="changeWeek(-1)">&#8592;</button>
      <span class="date-label" id="week-label"></span>
      <button onclick="changeWeek(1)">&#8594;</button>
    </div>
    <div style="margin-top:8px" id="week-content"></div>
  </div>

  <div class="view" id="view-settings">
    <div class="box">
      <div class="settings-section-title">Sync über GitHub</div>
      <div class="field"><label>Benutzer</label><input id="sync-owner" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label>Daten-Repo</label><input id="sync-repo" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label>Schlüssel</label><input id="sync-token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label>Gerät</label><input id="sync-device" placeholder="z. B. iPhone, Laptop"></div>
      <button class="save-btn" onclick="saveSyncSettings()">Speichern &amp; verbinden</button>
      <div class="hint" id="sync-info"></div>
    </div>

    <div class="box">
      <div class="settings-section-title">Schlafphasen</div>
      <div id="sleep-periods-list"></div>
      <button class="add-btn" style="margin-top:6px" onclick="addSleepPeriod()">+ Neue Schlafphase ab Datum</button>
      <div class="hint">Die jeweils gültige Phase wird automatisch angewendet. Ältere Tage bleiben unverändert.</div>
    </div>
    <div class="settings-section-title">Kategorien verwalten</div>
    <div id="cat-edit-list"></div>
    <button class="add-btn" onclick="addCategory()">+ Neue Kategorie</button>
    <button class="save-btn" onclick="saveCategories()">Kategorien &amp; Schlafphasen speichern</button>
  </div>
</div>

<script>
/* =====================================================================
   Datenmodell (v5)
   entries[ 'YYYY-MM-DD' ][ 'HH:MM' ] = { cat, note, t }
     t   = Zeitpunkt der letzten Änderung (ms) → beim Sync gewinnt der neuere
     cat = null  → Löschvermerk (Slot wurde geleert)
   Konfiguration (Kategorien + Schlafphasen) hat einen gemeinsamen Zeitstempel configT.
   Auf GitHub:  data/YYYY-MM.json  (ein File pro Monat)  +  config.json
   ===================================================================== */

const LS = {
  entries:'zt5_entries', config:'zt5_config', sync:'zt5_sync',
  shas:'zt5_shas', dirty:'zt5_dirty', cfgDirty:'zt5_cfgDirty', lastSync:'zt5_lastSync'
};
const API = 'https://api.github.com';

let categories = [
  {id:'schlafen',name:'Schlafen',color:'#E49EDD'},
  {id:'maja',name:'Maja',color:'#E4B7FF'},
  {id:'haushalt',name:'Haushalt',color:'#83E28E'},
  {id:'aktiv',name:'aktive Erholung',color:'#66CCFF'},
  {id:'sport',name:'Sport',color:'#27BB83'},
  {id:'toktok',name:'Tok Tok quatsch',color:'#6600CC'},
  {id:'commuting',name:'Commuting',color:'#FDD741'},
  {id:'div',name:'div',color:'#D9D9D9'},
  {id:'feufeu',name:'Feu Feu',color:'#D50000'},
  {id:'computer',name:'Computer',color:'#3A4A86'},
  {id:'moeko',name:'Möko',color:'#FF6B35'},
  {id:'tutor',name:'Tutor',color:'#7030A0'},
  {id:'mle',name:'MLE',color:'#A13563'},
  {id:'klima',name:'Klimawandel',color:'#43A047'},
  {id:'fp',name:'FP',color:'#e16c75'},
  {id:'pda',name:'PDA',color:'#94DCF8'},
];

function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
let sleepPeriods = [{from:dateKey(new Date()), catId:'schlafen', fromIdx:8, toIdx:27}];
let configT = 0;           // 0 = Standardwerte, noch nie bearbeitet
let entries = {};
let shas = {};             // Pfad → zuletzt bekannte GitHub-Version
let dirtyMonths = new Set();
let configDirty = false;
let editCounter = 0;
let syncCfg = {owner:'97fi', repo:'zeittracking-daten', token:'', device:''};
let lastSync = 0;

let currentDay = new Date(); currentDay.setHours(0,0,0,0);
let currentWeekOffset = 0;
let rangeStart = null, hoverIdx = null, holdTimer = null;
let inlinePickerSlotIdx = null;
let sleepExpanded = false;

/* ----------------------------------------------------------- Helfer */
function idxToHM(i){return{h:Math.floor(i/4),m:(i%4)*15}}
function slotKey(h,m){return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function hhmm(i){const {h,m}=idxToHM(i);return slotKey(h,m)}
function formatInterval(h,m){
  const nh=m===45?h+1:h,nm=(m+15)%60;
  return slotKey(h,m)+'–'+slotKey(nh,nm);
}
function contrastColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>145?'#1a1a1a':'#ffffff';
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x}

/* ----------------------------------------------------------- Einträge */
function getSlot(dk,key){const e=entries[dk]&&entries[dk][key];return e&&e.cat?e:null}
function dayHasData(dk){const d=entries[dk];return !!d&&Object.values(d).some(e=>e&&e.cat)}

function setSlot(dk,key,val){
  const existing = entries[dk] && entries[dk][key];
  if(!val){
    if(!existing || !existing.cat) return;      // war schon leer
    entries[dk][key] = {cat:null, note:'', t:Date.now()};
  } else {
    if(!entries[dk]) entries[dk] = {};
    entries[dk][key] = {cat:val.cat, note:val.note||'', t:Date.now()};
  }
  markDirty(dk);
}
function markDirty(dk){
  dirtyMonths.add(dk.slice(0,7));
  editCounter++;
  saveLocal();
  scheduleSync(15000);
}

function getSleepPeriodForDay(d){
  if(!sleepPeriods.length) return null;
  const dk=dateKey(d);
  const sorted=[...sleepPeriods].sort((a,b)=>a.from>b.from?-1:1);
  return sorted.find(p=>p.from<=dk) || sorted[sorted.length-1];
}
function isAutoSleepForDay(d,idx){
  const p=getSleepPeriodForDay(d); if(!p) return false;
  const f=p.fromIdx,t=p.toIdx;
  return f<=t?idx>=f&&idx<=t:idx>=f||idx<=t;
}
function isSleepIdx(idx){return isAutoSleepForDay(currentDay,idx)}
function getEffectiveEntry(d,idx){
  const e=getSlot(dateKey(d),hhmm(idx));
  if(e) return {entry:e,auto:false};
  if(isAutoSleepForDay(d,idx)){
    const p=getSleepPeriodForDay(d);
    if(categories.find(c=>c.id===p.catId)) return {entry:{cat:p.catId,note:''},auto:true};
  }
  return {entry:null,auto:false};
}

/* ----------------------------------------------------------- Lokal speichern */
function saveLocal(){
  try{
    localStorage.setItem(LS.entries, JSON.stringify(entries));
    localStorage.setItem(LS.config, JSON.stringify({t:configT,categories,sleepPeriods}));
    localStorage.setItem(LS.shas, JSON.stringify(shas));
    localStorage.setItem(LS.dirty, JSON.stringify([...dirtyMonths]));
    localStorage.setItem(LS.cfgDirty, configDirty?'1':'0');
    localStorage.setItem(LS.sync, JSON.stringify(syncCfg));
    localStorage.setItem(LS.lastSync, String(lastSync));
  }catch(e){}
}
function loadLocal(){
  try{
    const e=localStorage.getItem(LS.entries);
    const c=localStorage.getItem(LS.config);
    if(e) entries=JSON.parse(e);
    if(c){const cf=JSON.parse(c);categories=cf.categories;sleepPeriods=cf.sleepPeriods;configT=cf.t||0;}
    shas=JSON.parse(localStorage.getItem(LS.shas)||'{}');
    dirtyMonths=new Set(JSON.parse(localStorage.getItem(LS.dirty)||'[]'));
    configDirty=localStorage.getItem(LS.cfgDirty)==='1';
    Object.assign(syncCfg, JSON.parse(localStorage.getItem(LS.sync)||'{}'));
    lastSync=+(localStorage.getItem(LS.lastSync)||0);
    // Altdaten der v4 auf derselben Adresse übernehmen
    if(!e && !c && localStorage.getItem('zt_entries')){
      importV4({
        entries:JSON.parse(localStorage.getItem('zt_entries')||'{}'),
        categories:JSON.parse(localStorage.getItem('zt_categories')||'null'),
        sleepPeriods:JSON.parse(localStorage.getItem('zt_sleepPeriods')||'null')
      });
    }
  }catch(e){}
}

/* ----------------------------------------------------------- Import / Export */
function exportData(){
  const data={version:5,exportedAt:new Date().toISOString(),entries,config:{t:configT,categories,sleepPeriods}};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='zeittracking_'+dateKey(new Date())+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  flashStatus('exportiert');
}

// v4 hat Tage unter dem UTC-Datum gespeichert → in Deutschland einen Tag zu früh.
function v4KeyToLocal(dk){
  const [y,m,d]=dk.split('-').map(Number);
  const next=new Date(y,m-1,d+1);
  return next.getTimezoneOffset()<0 ? dateKey(next) : dk;
}
function mergeEntry(dk,key,r){
  const l=entries[dk]&&entries[dk][key];
  if(!l || (r.t||0)>(l.t||0)){
    if(!entries[dk]) entries[dk]={};
    entries[dk][key]={cat:r.cat??null,note:r.note||'',t:r.t||0};
    return true;
  }
  return false;
}
function importV4(data){
  for(const [dk,slots] of Object.entries(data.entries||{})){
    const nk=v4KeyToLocal(dk);
    for(const [k,e] of Object.entries(slots)){
      if(e&&e.cat&&mergeEntry(nk,k,{cat:e.cat,note:e.note,t:1})) dirtyMonths.add(nk.slice(0,7));
    }
  }
  if(data.categories) categories=data.categories;
  if(data.sleepPeriods) sleepPeriods=data.sleepPeriods;
  configT=Date.now(); configDirty=true;
}
function importData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.version===5){
        for(const [dk,slots] of Object.entries(data.entries||{}))
          for(const [k,s] of Object.entries(slots)) if(mergeEntry(dk,k,s)) dirtyMonths.add(dk.slice(0,7));
        if(data.config && (data.config.t||0)>configT){
          categories=data.config.categories; sleepPeriods=data.config.sleepPeriods; configT=data.config.t; configDirty=true;
        }
      } else {
        importV4(data);
      }
      editCounter++; saveLocal(); renderAll(); flashStatus('importiert'); scheduleSync(1000);
    }catch(err){ alert('Fehler beim Import – ist das eine gültige Zeittracking-Datei?'); }
  };
  reader.readAsText(file);
  event.target.value='';
}

/* =====================================================================
   Sync mit GitHub
   ===================================================================== */
let syncing=false, syncAgain=false, syncTimer=null, statusTimer=null;

function setStatus(text,cls){
  const s=document.getElementById('sync-status');
  s.textContent=text; s.className=cls||'';
}
function flashStatus(text){
  setStatus(text);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(showIdleStatus,2000);
}
function showIdleStatus(){
  if(!syncCfg.token){setStatus('lokal');return;}
  if(dirtyMonths.size||configDirty){setStatus('● ungesynct');return;}
  if(lastSync){const d=new Date(lastSync);setStatus('✓ '+slotKey(d.getHours(),d.getMinutes()),'ok');return;}
  setStatus('–');
}
function scheduleSync(ms){
  if(!syncCfg.token) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>sync(),ms);
}
function deviceName(){
  return syncCfg.device || (/iPhone|iPad|Android/.test(navigator.userAgent)?'Handy':'Laptop');
}

function b64enc(str){
  const bytes=new TextEncoder().encode(str); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(b64.replace(/\s/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}

async function gh(method,path,body){
  const res=await fetch(`${API}/repos/${encodeURIComponent(syncCfg.owner)}/${encodeURIComponent(syncCfg.repo)}/${path}`,{
    method, cache:'no-store',
    headers:Object.assign({
      'Authorization':'Bearer '+syncCfg.token,
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    }, body?{'Content-Type':'application/json'}:{}),
    body:body?JSON.stringify(body):undefined
  });
  if(method==='GET' && res.status===404) return null;
  if(!res.ok){const err=new Error('GitHub '+res.status);err.status=res.status;throw err;}
  return res.json();
}

// Monatsdatei so schreiben, dass jeder Slot eine Zeile ist (übersichtliche Diffs auf GitHub)
function buildMonth(m){
  const lines=[];
  for(const dk of Object.keys(entries).filter(d=>d.startsWith(m)).sort()){
    const slots=Object.keys(entries[dk]).sort();
    if(!slots.length) continue;
    lines.push(' '+JSON.stringify(dk)+':{\n'+slots.map(k=>'  '+JSON.stringify(k)+':'+JSON.stringify(entries[dk][k])).join(',\n')+'\n }');
  }
  return '{"version":1,"month":'+JSON.stringify(m)+',"days":{\n'+lines.join(',\n')+'\n}}\n';
}

// Remote-Stand eines Monats einarbeiten. behind = Remote fehlt etwas, das lokal neuer ist.
function mergeMonth(m,remoteDays){
  let changed=false, behind=false;
  for(const [dk,slots] of Object.entries(remoteDays||{}))
    for(const [k,r] of Object.entries(slots)) if(mergeEntry(dk,k,r)) changed=true;
  for(const dk of Object.keys(entries)){
    if(!dk.startsWith(m)) continue;
    for(const [k,l] of Object.entries(entries[dk])){
      const r=remoteDays&&remoteDays[dk]&&remoteDays[dk][k];
      if(!r || (l.t||0)>(r.t||0)) behind=true;
    }
  }
  return {changed,behind};
}

async function pullMonth(m){
  const path='data/'+m+'.json';
  const f=await gh('GET','contents/'+path);
  if(!f){delete shas[path];return {changed:false,behind:true};}
  const data=JSON.parse(b64dec(f.content));
  const res=mergeMonth(m,data.days);
  shas[path]=f.sha;
  return res;
}
async function pushMonth(m){
  const path='data/'+m+'.json';
  for(let attempt=0;attempt<4;attempt++){
    const v=editCounter;
    const body={message:m+' · '+deviceName(),content:b64enc(buildMonth(m))};
    if(shas[path]) body.sha=shas[path];
    try{
      const r=await gh('PUT','contents/'+path,body);
      shas[path]=r.content.sha;
      if(editCounter===v) dirtyMonths.delete(m); else syncAgain=true;
      return;
    }catch(e){
      // 409/422: jemand anderes war schneller (oder Datei existiert schon) → holen, zusammenführen, nochmal
      if(e.status===409||e.status===422){const r=await pullMonth(m);if(r.changed)renderAll();continue;}
      throw e;
    }
  }
  throw new Error('Konflikt bei '+m);
}

async function pullConfig(){
  const f=await gh('GET','contents/config.json');
  if(!f){delete shas['config.json'];configDirty=true;return false;}
  shas['config.json']=f.sha;
  const c=JSON.parse(b64dec(f.content));
  if((c.t||0)>configT){
    categories=c.categories; sleepPeriods=c.sleepPeriods; configT=c.t; configDirty=false;
    return true;
  }
  if(configT>(c.t||0)) configDirty=true;
  return false;
}
async function pushConfig(){
  for(let attempt=0;attempt<4;attempt++){
    const body={message:'Konfiguration · '+deviceName(),content:b64enc(JSON.stringify({version:1,t:configT,categories,sleepPeriods},null,1)+'\n')};
    if(shas['config.json']) body.sha=shas['config.json'];
    try{
      const r=await gh('PUT','contents/config.json',body);
      shas['config.json']=r.content.sha; configDirty=false; return;
    }catch(e){
      if(e.status===409||e.status===422){if(await pullConfig())renderAll();if(!configDirty)return;continue;}
      throw e;
    }
  }
}

async function sync(manual){
  if(!syncCfg.token||!syncCfg.owner||!syncCfg.repo){if(manual)flashStatus('kein Sync eingerichtet');return;}
  if(syncing){syncAgain=true;return;}
  syncing=true; clearTimeout(syncTimer); setStatus('sync…');
  try{
    const root=await gh('GET','contents/');
    if(root===null) throw Object.assign(new Error('Repo nicht gefunden'),{status:404});
    const cfgFile=root.find(f=>f.path==='config.json');
    const hasData=root.some(f=>f.path==='data'&&f.type==='dir');
    const files=hasData?(await gh('GET','contents/data')||[]):[];

    let changed=false;
    const toPush=new Set(dirtyMonths);
    for(const f of files){
      const mm=f.name.match(/^(\d{4}-\d{2})\.json$/);
      if(!mm || shas[f.path]===f.sha) continue;
      const r=await pullMonth(mm[1]);
      if(r.changed) changed=true;
      if(r.behind) toPush.add(mm[1]);
    }
    if(!cfgFile) configDirty=true;
    else if(shas['config.json']!==cfgFile.sha && await pullConfig()) changed=true;

    saveLocal();
    if(changed) renderAll();
    for(const m of toPush) await pushMonth(m);
    if(configDirty) await pushConfig();

    lastSync=Date.now();
    saveLocal();
    showIdleStatus();
  }catch(e){
    saveLocal();
    if(e.status===401) setStatus('Schlüssel ungültig','err');
    else if(e.status===403||e.status===404) setStatus('kein Zugriff aufs Repo','err');
    else if(!navigator.onLine||e instanceof TypeError) setStatus('offline – später','err');
    else setStatus('Sync-Fehler','err');
    console.error(e);
  }finally{
    syncing=false;
    if(syncAgain){syncAgain=false;scheduleSync(2000);}
  }
}

/* ----------------------------------------------------------- Sync-Einstellungen */
function renderSyncSettings(){
  document.getElementById('sync-owner').value=syncCfg.owner;
  document.getElementById('sync-repo').value=syncCfg.repo;
  document.getElementById('sync-token').value=syncCfg.token;
  document.getElementById('sync-device').value=syncCfg.device;
  const info=document.getElementById('sync-info');
  if(!syncCfg.token) info.textContent='Noch nicht verbunden. Der Schlüssel bleibt nur auf diesem Gerät gespeichert.';
  else info.textContent='Verbunden mit '+syncCfg.owner+'/'+syncCfg.repo+(lastSync?' · zuletzt '+new Date(lastSync).toLocaleString('de-DE'):'');
}
async function saveSyncSettings(){
  syncCfg.owner=document.getElementById('sync-owner').value.trim();
  syncCfg.repo=document.getElementById('sync-repo').value.trim();
  syncCfg.token=document.getElementById('sync-token').value.trim();
  syncCfg.device=document.getElementById('sync-device').value.trim();
  saveLocal();
  const info=document.getElementById('sync-info');
  if(!syncCfg.token){info.textContent='Sync aus.';showIdleStatus();return;}
  info.textContent='Teste Verbindung…';
  try{
    const res=await fetch(`${API}/repos/${encodeURIComponent(syncCfg.owner)}/${encodeURIComponent(syncCfg.repo)}`,{
      cache:'no-store',headers:{'Authorization':'Bearer '+syncCfg.token,'Accept':'application/vnd.github+json'}});
    if(res.status===401){info.textContent='❌ Schlüssel ungültig oder abgelaufen.';return;}
    if(!res.ok){info.textContent='❌ Repo nicht gefunden oder kein Zugriff ('+res.status+'). Benutzer/Repo-Name prüfen und ob der Schlüssel für dieses Repo freigegeben ist.';return;}
    const repo=await res.json();
    info.textContent=repo.private?'✓ Verbunden, synchronisiere…':'⚠ Verbunden, aber das Repo ist öffentlich! Bitte auf privat stellen.';
    await sync(true);
    renderSyncSettings();
  }catch(e){info.textContent='❌ Keine Verbindung zu GitHub (offline?).';}
}

function buildInlinePicker(forIdx,fromIdx,onSelect){
  const panel=document.createElement('div');
  panel.className='picker-panel'; panel.style.margin='4px 0 4px 92px';
  const {h:fh,m:fm}=idxToHM(fromIdx), {h:th,m:tm}=idxToHM(forIdx);
  const title=document.createElement('div'); title.className='picker-title';
  title.textContent=fromIdx===forIdx?formatInterval(fh,fm):formatInterval(fh,fm).split('–')[0]+'–'+formatInterval(th,tm).split('–')[1];
  panel.appendChild(title);
  const grid=document.createElement('div'); grid.className='picker-grid';
  categories.filter(c=>!c.archived).forEach(c=>{
    const pill=document.createElement('button'); pill.className='cat-pill';
    pill.style.background=c.color; pill.style.color=contrastColor(c.color);
    pill.textContent=c.name; pill.onclick=()=>onSelect(c.id);
    grid.appendChild(pill);
  });
  const clr=document.createElement('button'); clr.className='cat-pill clear'; clr.textContent='leeren';
  clr.onclick=()=>onSelect(null); grid.appendChild(clr);
  panel.appendChild(grid);
  const noteRow=document.createElement('div'); noteRow.className='note-row';
  const noteInp=document.createElement('input'); noteInp.className='note-input'; noteInp.type='text';
  noteInp.placeholder='Notiz (optional)'; noteInp.id='inline-note-input';
  noteRow.appendChild(noteInp); panel.appendChild(noteRow);
  return panel;
}

function getRecentNotes(catId,limit=10){
  const seen=new Set(),result=[];
  for(const dk of Object.keys(entries).sort().reverse()){
    for(const sk of Object.keys(entries[dk]).sort().reverse()){
      const e=entries[dk][sk];
      if(e&&e.cat===catId&&e.note&&e.note.trim()){
        const n=e.note.trim();
        if(!seen.has(n)){seen.add(n);result.push(n);if(result.length>=limit)return result;}
      }
    }
  }
  return result;
}

function buildNoteEditPanel(key,currentNote,onSave,catId){
  const panel=document.createElement('div');
  panel.className='picker-panel'; panel.style.margin='4px 0 4px 92px';
  const title=document.createElement('div'); title.className='picker-title'; title.textContent='Notiz: '+key;
  panel.appendChild(title);
  const inp=document.createElement('input'); inp.className='note-input'; inp.type='text';
  inp.value=currentNote||''; inp.placeholder='Notiz eingeben...';
  setTimeout(()=>inp.focus(),50);
  if(catId){
    const recent=getRecentNotes(catId);
    if(recent.length){
      const row=document.createElement('div');
      row.style.cssText='display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px';
      recent.forEach(n=>{
        const chip=document.createElement('button');
        chip.style.cssText='font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#444';
        chip.textContent=n; chip.onclick=()=>onSave(n);
        row.appendChild(chip);
      });
      panel.appendChild(row);
    }
  }
  const noteRow=document.createElement('div'); noteRow.className='note-row';
  const btn=document.createElement('button'); btn.className='note-save-btn'; btn.textContent='OK';
  btn.onclick=()=>onSave(inp.value.trim());
  inp.onkeydown=e=>{if(e.key==='Enter')onSave(inp.value.trim());};
  noteRow.appendChild(inp); noteRow.appendChild(btn); panel.appendChild(noteRow);
  return panel;
}

/* ----------------------------------------------------------- Kalender */
let calOpen=false, calViewYear=null, calViewMonth=null;
function toggleCalendar(){
  calOpen=!calOpen;
  if(calOpen){calViewYear=currentDay.getFullYear();calViewMonth=currentDay.getMonth();renderCalendar();}
  document.getElementById('cal-container').style.display=calOpen?'block':'none';
}
function renderCalendar(){
  const con=document.getElementById('cal-container');
  const y=calViewYear,mo=calViewMonth;
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const firstDay=new Date(y,mo,1).getDay();
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const offset=firstDay===0?6:firstDay-1;
  con.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='cal-wrap';
  const hdr=document.createElement('div'); hdr.className='cal-header';
  const prev=document.createElement('button'); prev.textContent='‹';
  prev.onclick=()=>{calViewMonth--;if(calViewMonth<0){calViewMonth=11;calViewYear--;}renderCalendar();};
  const lbl=document.createElement('span'); lbl.className='cal-month-label'; lbl.textContent=monthNames[mo]+' '+y;
  const next=document.createElement('button'); next.textContent='›';
  next.onclick=()=>{calViewMonth++;if(calViewMonth>11){calViewMonth=0;calViewYear++;}renderCalendar();};
  hdr.appendChild(prev); hdr.appendChild(lbl); hdr.appendChild(next); wrap.appendChild(hdr);
  const grid=document.createElement('div'); grid.className='cal-grid';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
  const today=new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<offset;i++){const el=document.createElement('div');el.className='cal-day empty';grid.appendChild(el);}
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(y,mo,d);
    const el=document.createElement('div'); el.className='cal-day'; el.textContent=d;
    if(date.getTime()===today.getTime()) el.classList.add('today');
    if(date.getTime()===currentDay.getTime()) el.classList.add('selected');
    if(dayHasData(dateKey(date))) el.classList.add('has-data');
    el.onclick=()=>{
      currentDay=date; inlinePickerSlotIdx=null; rangeStart=null; calOpen=false;
      document.getElementById('cal-container').style.display='none';
      renderDay();
    };
    grid.appendChild(el);
  }
  wrap.appendChild(grid); con.appendChild(wrap);
}

/* ----------------------------------------------------------- Tagesansicht */
function renderDay(){
  document.getElementById('day-label').textContent=currentDay.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const container=document.getElementById('slots-container'); container.innerHTML='';
  let i=0;
  while(i<96){
    if(isSleepIdx(i)){
      const blockStart=i; let blockEnd=i;
      while(blockEnd+1<96&&isSleepIdx(blockEnd+1)) blockEnd++;
      const sp=getSleepPeriodForDay(currentDay);
      const cat=categories.find(c=>c.id===sp.catId);
      const collapsed=document.createElement('div'); collapsed.className='sleep-collapsed';
      const bar=document.createElement('div'); bar.className='sleep-collapsed-bar'; bar.style.background=cat?cat.color:'#E49EDD';
      const mins=(blockEnd-blockStart+1)*15;
      const {h:eh,m:em}=idxToHM(blockEnd);
      const label=document.createElement('span'); label.className='sleep-collapsed-label';
      label.textContent=(cat?cat.name:sp.catId)+' · '+hhmm(blockStart)+'–'+formatInterval(eh,em).split('–')[1]+' · '+Math.floor(mins/60)+'h'+(mins%60?String(mins%60).padStart(2,'0')+'m':'');
      const arrow=document.createElement('span'); arrow.className='sleep-collapsed-arrow'; arrow.textContent=sleepExpanded?'▲':'▼';
      collapsed.appendChild(bar); collapsed.appendChild(label); collapsed.appendChild(arrow);
      collapsed.onclick=()=>{sleepExpanded=!sleepExpanded;renderDay();};
      container.appendChild(collapsed);
      if(sleepExpanded) for(let j=blockStart;j<=blockEnd;j++){container.appendChild(buildSlotEl(j));maybeInjectPicker(container,j);}
      i=blockEnd+1;
    } else {
      container.appendChild(buildSlotEl(i)); maybeInjectPicker(container,i); i++;
    }
  }
  renderDaySummary();
  updateHint();
}

function handleRangeHover(e){
  if(rangeStart===null||inlinePickerSlotIdx!==null) return;
  const block=e.target.closest&&e.target.closest('.slot-block');
  if(!block||block._slotIdx===undefined||block._slotIdx===hoverIdx) return;
  hoverIdx=block._slotIdx; updateRangeHighlight();
}
function updateRangeHighlight(){
  if(rangeStart===null) return;
  const from=Math.min(rangeStart,hoverIdx??rangeStart), to=Math.max(rangeStart,hoverIdx??rangeStart);
  document.querySelectorAll('.slot-block').forEach(b=>{
    if(b._slotIdx===undefined) return;
    const idx=b._slotIdx;
    b.classList.toggle('in-range',idx>from&&idx<=to);
    b.classList.toggle('range-end',idx===to&&idx!==rangeStart);
  });
}

function maybeInjectPicker(container,i){
  if(inlinePickerSlotIdx===null) return;
  const {type,atIdx,fromIdx}=inlinePickerSlotIdx;
  if(i!==atIdx) return;
  const dk=dateKey(currentDay), key=hhmm(atIdx);
  if(type==='cat'){
    container.appendChild(buildInlinePicker(atIdx,fromIdx,catId=>{
      const ni=document.getElementById('inline-note-input');
      const note=ni?ni.value.trim():'';
      const from=Math.min(fromIdx,atIdx), to=Math.max(fromIdx,atIdx);
      for(let j=from;j<=to;j++) setSlot(dk,hhmm(j),catId?{cat:catId,note:j===from?note:''}:null);
      inlinePickerSlotIdx=null; rangeStart=null; renderDay();
    }));
  } else if(type==='note'){
    const {entry}=getEffectiveEntry(currentDay,atIdx);
    container.appendChild(buildNoteEditPanel(key,entry?entry.note:'',note=>{
      if(entry) setSlot(dk,key,{cat:entry.cat,note});
      inlinePickerSlotIdx=null; renderDay();
    },entry?entry.cat:null));
  }
}

function updateHint(){
  document.getElementById('mode-hint').textContent = rangeStart!==null
    ? 'Letzten Slot antippen — oder denselben nochmal für Einzelslot'
    : '1× tippen = Start wählen  |  Halten = Notiz';
}

function buildSlotEl(i){
  const {h,m}=idxToHM(i);
  const {entry}=getEffectiveEntry(currentDay,i);
  const cat=entry?categories.find(c=>c.id===entry.cat):null;
  const prev=i>0?getEffectiveEntry(currentDay,i-1):{entry:null};
  const isCont=prev.entry&&entry&&prev.entry.cat===entry.cat&&!isSleepIdx(i-1);

  const slot=document.createElement('div'); slot.className='slot';
  const timeEl=document.createElement('span'); timeEl.className='slot-time'; timeEl.textContent=formatInterval(h,m);
  slot.appendChild(timeEl);
  const block=document.createElement('div');
  block.className='slot-block'+(cat?'':' empty');
  if(rangeStart===i) block.classList.add('selecting-start');
  if(inlinePickerSlotIdx&&inlinePickerSlotIdx.type==='cat'&&i>=Math.min(inlinePickerSlotIdx.fromIdx,inlinePickerSlotIdx.atIdx)&&i<=Math.max(inlinePickerSlotIdx.fromIdx,inlinePickerSlotIdx.atIdx)) block.classList.add('in-range');
  if(cat){
    block.style.background=cat.color; block.style.borderColor=cat.color;
    const tc=contrastColor(cat.color);
    const lbl=document.createElement('span'); lbl.className='slot-label'; lbl.style.color=tc;
    lbl.textContent=isCont?' ':cat.name;
    if(!isCont||entry.note) block.appendChild(lbl);
    if(entry.note){const n=document.createElement('span');n.className='slot-note';n.style.color=tc;n.textContent=entry.note;block.appendChild(n);}
  }

  // Tippen / Halten über Pointer-Events (funktioniert für Maus und Touch gleich)
  let pressed=false;
  block.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    pressed=true;
    if(cat) holdTimer=setTimeout(()=>{
      holdTimer=null; pressed=false; rangeStart=null;
      inlinePickerSlotIdx={type:'note',atIdx:i,fromIdx:i};
      renderDay();
    },600);
  });
  block.addEventListener('pointerup',()=>{
    if(!pressed) return;
    pressed=false;
    clearTimeout(holdTimer); holdTimer=null;
    handleTap(i);
  });
  const cancel=()=>{pressed=false;clearTimeout(holdTimer);holdTimer=null;};
  block.addEventListener('pointercancel',cancel);
  block.addEventListener('pointerleave',cancel);
  block.addEventListener('contextmenu',e=>e.preventDefault());
  block._slotIdx=i;
  slot.appendChild(block);
  return slot;
}

function handleTap(idx){
  if(rangeStart===null){
    rangeStart=idx; hoverIdx=null; inlinePickerSlotIdx=null;
  } else {
    const from=Math.min(rangeStart,idx), to=Math.max(rangeStart,idx);
    inlinePickerSlotIdx={type:'cat',atIdx:to,fromIdx:from};
    rangeStart=null; hoverIdx=null;
  }
  renderDay();
}

function renderDaySummary(){
  const counts={};
  for(let i=0;i<96;i++){const {entry}=getEffectiveEntry(currentDay,i);if(entry&&entry.cat)counts[entry.cat]=(counts[entry.cat]||0)+1;}
  const summary=document.getElementById('day-summary'); summary.innerHTML='';
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(([id,n])=>{
    const cat=categories.find(c=>c.id===id); if(!cat) return;
    const pill=document.createElement('span'); pill.className='summary-pill';
    pill.style.background=cat.color; pill.style.color=contrastColor(cat.color);
    const h=Math.floor(n/4),min=n%4*15;
    pill.textContent=cat.name+' '+h+'h'+(min?min+'m':''); summary.appendChild(pill);
  });
}

function changeDay(d){currentDay=addDays(currentDay,d);inlinePickerSlotIdx=null;rangeStart=null;hoverIdx=null;renderDay();}

/* ----------------------------------------------------------- Woche */
function getWeekStart(offset){
  const now=new Date(); now.setHours(0,0,0,0);
  const day=now.getDay();
  return addDays(now,-(day===0?6:day-1)+offset*7);
}
function renderWeek(){
  const ws=getWeekStart(currentWeekOffset), we=addDays(ws,6);
  document.getElementById('week-label').textContent=ws.toLocaleDateString('de-DE',{day:'numeric',month:'short'})+' – '+we.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
  const totals={}; let total=0;
  for(let i=0;i<7;i++){const d=addDays(ws,i);for(let j=0;j<96;j++){const {entry}=getEffectiveEntry(d,j);if(entry&&entry.cat){totals[entry.cat]=(totals[entry.cat]||0)+1;total++;}}}
  const content=document.getElementById('week-content'); content.innerHTML='';
  if(total===0){const p=document.createElement('p');p.style.cssText='font-size:13px;color:#aaa;text-align:center;padding:24px 0';p.textContent='Noch keine Einträge diese Woche';content.appendChild(p);return;}
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const bar=document.createElement('div'); bar.className='week-bar';
  sorted.forEach(([id,n])=>{const cat=categories.find(c=>c.id===id);if(!cat)return;const seg=document.createElement('div');seg.style.cssText='flex:'+n+';background:'+cat.color;bar.appendChild(seg);});
  content.appendChild(bar);
  sorted.forEach(([id,n])=>{
    const cat=categories.find(c=>c.id===id); if(!cat) return;
    const row=document.createElement('div'); row.className='stat-row';
    const dot=document.createElement('div'); dot.className='stat-dot'; dot.style.background=cat.color;
    const name=document.createElement('span'); name.className='stat-name'; name.textContent=cat.name;
    const val=document.createElement('span'); val.className='stat-val'; const mins=n*15;
    val.textContent=Math.floor(mins/60)+'h '+String(mins%60).padStart(2,'0')+'m';
    row.appendChild(dot); row.appendChild(name); row.appendChild(val); content.appendChild(row);
  });
}
function changeWeek(d){currentWeekOffset+=d;renderWeek();}

  sel.style.cssText='font-size:11px;padding:2px 4px;border-radius:6px;border:1px solid #ddd;background:#fff';
  for(let i=0;i<=96;i++){
    const opt=document.createElement('option'); opt.value=i; opt.textContent=i===96?'24:00':hhmm(i);
    if(i===selectedIdx) opt.selected=true; sel.appendChild(opt);
  }
  return sel;
}
function renderSleepConfig(){
  const list=document.getElementById('sleep-periods-list'); list.innerHTML='';
  [...sleepPeriods].sort((a,b)=>a.from>b.from?1:-1).forEach(p=>{
    const block=document.createElement('div');
    block.style.cssText='background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:8px 10px;margin-bottom:8px';
    const dateRow=document.createElement('div'); dateRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px';
    const dateLbl=document.createElement('span'); dateLbl.style.cssText='font-size:11px;color:#888;min-width:32px'; dateLbl.textContent='Ab';
    const dateInp=document.createElement('input'); dateInp.type='date'; dateInp.value=p.from;
    dateInp.style.cssText='font-size:12px;padding:2px 6px;border:1px solid #ddd;border-radius:6px;background:#fff';
    dateInp.onchange=e=>{p.from=e.target.value;renderSleepConfig();};
    const del=document.createElement('button'); del.textContent='×';
    del.style.cssText='background:none;border:none;cursor:pointer;color:#bbb;font-size:16px;margin-left:auto;padding:0';
    del.onclick=()=>{sleepPeriods.splice(sleepPeriods.indexOf(p),1);renderSleepConfig();};
    dateRow.appendChild(dateLbl); dateRow.appendChild(dateInp); dateRow.appendChild(del); block.appendChild(dateRow);
    const timeRow=document.createElement('div'); timeRow.style.cssText='display:flex;align-items:center;gap:6px;flex-wrap:wrap';
    const catSel=document.createElement('select');
    catSel.style.cssText='font-size:11px;padding:2px 4px;border-radius:6px;border:1px solid #ddd;background:#fff;flex:1;min-width:80px';
    categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;if(c.id===p.catId)o.selected=true;catSel.appendChild(o);});
    catSel.onchange=e=>p.catId=e.target.value;
    const fromSel=timeOptions(p.fromIdx); fromSel.onchange=e=>p.fromIdx=parseInt(e.target.value);
    const toSel=timeOptions(p.toIdx+1); toSel.onchange=e=>p.toIdx=parseInt(e.target.value)-1;
    const bis=document.createElement('span'); bis.style.cssText='font-size:11px;color:#aaa'; bis.textContent='bis';
    timeRow.appendChild(catSel); timeRow.appendChild(fromSel); timeRow.appendChild(bis); timeRow.appendChild(toSel);
    block.appendChild(timeRow); list.appendChild(block);
  });
}
function addSleepPeriod(){sleepPeriods.push({from:dateKey(new Date()),catId:'schlafen',fromIdx:8,toIdx:27});renderSleepConfig();}

function renderSettings(){
  renderSyncSettings();
  renderSleepConfig();
  const list=document.getElementById('cat-edit-list'); list.innerHTML='';
  const makeRow=cat=>{
    const row=document.createElement('div'); row.className='cat-edit-row';
    if(cat.archived) row.style.opacity='0.5';
    const sw=document.createElement('input'); sw.type='color'; sw.value=cat.color;
    sw.style.cssText='width:26px;height:26px;padding:0;border:1px solid #ddd;border-radius:4px;cursor:pointer;flex-shrink:0';
    sw.oninput=e=>cat.color=e.target.value;
    const inp=document.createElement('input'); inp.type='text'; inp.className='cat-name-input'; inp.value=cat.name;
    inp.oninput=e=>cat.name=e.target.value;
    if(cat.archived) inp.style.textDecoration='line-through';
    const arch=document.createElement('button');
    arch.style.cssText='background:none;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:11px;padding:2px 7px;color:#888;white-space:nowrap';
    arch.textContent=cat.archived?'aktivieren':'archiv.';
    arch.onclick=()=>{cat.archived=!cat.archived;renderSettings();};
    const del=document.createElement('button'); del.className='del-btn'; del.textContent='×';
    del.onclick=()=>{if(confirm('Kategorie „'+cat.name+'“ löschen? (Archivieren behält alte Einträge in der Auswertung)')){categories.splice(categories.indexOf(cat),1);renderSettings();}};
    row.appendChild(sw); row.appendChild(inp); row.appendChild(arch); row.appendChild(del); list.appendChild(row);
  };
  const section=(title,arr)=>{
    if(!arr.length) return;
    const lbl=document.createElement('div'); lbl.style.cssText='font-size:11px;color:#aaa;margin:8px 0 6px;text-transform:uppercase;letter-spacing:0.04em'; lbl.textContent=title;
    list.appendChild(lbl); arr.forEach(makeRow);
  };
  section('Aktiv',categories.filter(c=>!c.archived));
  section('Archiviert',categories.filter(c=>c.archived));
}
function addCategory(){categories.push({id:'cat_'+Date.now(),name:'Neu',color:'#AAAAAA',archived:false});renderSettings();}
function saveCategories(){
  configT=Date.now(); configDirty=true; editCounter++;
  saveLocal(); renderAll(); flashStatus('gespeichert'); scheduleSync(1000);
}

/* ----------------------------------------------------------- Navigation */
let activeView='day';
function showView(name){
  activeView=name;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(name==='week') renderWeek();
  if(name==='settings') renderSettings();
  if(name==='day') renderDay();
}
function renderAll(){
  renderDay();
  if(activeView==='week') renderWeek();
  if(calOpen) renderCalendar();
}

/* ----------------------------------------------------------- Start */
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showView(b.dataset.view));
const slotsCon=document.getElementById('slots-container');
slotsCon.addEventListener('pointerover',handleRangeHover);

// Sync-Auslöser: App öffnen, wieder in den Vordergrund, App verlassen, wieder online
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(dirtyMonths.size||configDirty) sync(); }
  else sync();
});
window.addEventListener('online',()=>sync());

loadLocal();
renderDay();
showIdleStatus();
sync();

if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
